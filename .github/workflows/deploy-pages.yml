name: Build and publish Fartak POS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract AI Studio project
        run: |
          rm -rf app
          mkdir app
          unzip -q fartak-pos.zip -d app

      - name: Prepare for GitHub Pages
        working-directory: app
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("vite.config.ts")
          s = p.read_text()
          if "base:" not in s:
              s = s.replace("return {\n    plugins:", "return {\n    base: './',\n    plugins:")
              p.write_text(s)
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: app
        run: npm install

      - name: Build
        working-directory: app
        run: npm run build

      - name: Publish dist to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./app/dist
          force_orphan: true
